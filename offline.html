<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3efe6" />
    <title>Mein Deutsch · 离线提示</title>
    <style>
      :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #f3efe6; color: #171714; }
      main { width: min(82vw, 28rem); padding: 2rem; border: 1px solid #171714; background: #fffdf7; box-shadow: 8px 8px 0 #d8cfbd; }
      b { display: block; margin-bottom: 1rem; font-size: .78rem; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0 0 1rem; font-size: clamp(2rem, 9vw, 3.5rem); line-height: .96; }
      p { margin: .6rem 0; line-height: 1.55; }
      button { margin-top: 1rem; padding: .8rem 1rem; border: 1px solid #171714; border-radius: 0; background: #171714; color: white; font: inherit; }
    </style>
  </head>
  <body>
    <main>
      <b>Mein Deutsch · Offline</b>
      <h1>首次缓存尚未完成</h1>
      <p>请连接网络并重新打开一次。题库与语音保存完成后，这个 App 可以完全离线使用。</p>
      <p>Please reconnect once to finish the first download. After that, the lessons and audio work fully offline.</p>
      <button type="button" onclick="location.reload()">重新尝试 · Retry</button>
    </main>
  </body>
</html>
